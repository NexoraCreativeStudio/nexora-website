<script>
  // ROI Calculator (homepage-only — elements don't exist on other Phase 1 pages)
  function syncPair(numId, rangeId){
    const num = document.getElementById(numId);
    const range = document.getElementById(rangeId);
    if(!num || !range) return;
    num.addEventListener('input', ()=>{ range.value = num.value; calcROI(); });
    range.addEventListener('input', ()=>{ num.value = range.value; calcROI(); });
  }
  function calcROI(){
    const value = parseFloat(document.getElementById('roi-value').value) || 0;
    const missed = parseFloat(document.getElementById('roi-missed').value) || 0;
    const conv = parseFloat(document.getElementById('roi-conv').value) || 0;
    const bookingsPerWeek = missed * (conv/100);
    const bookingsPerMonth = bookingsPerWeek * 4.33;
    const monthlyRevenue = bookingsPerMonth * value;
    const yearlyRevenue = monthlyRevenue * 12;
    document.getElementById('roi-monthly').textContent = Math.round(monthlyRevenue).toLocaleString();
    document.getElementById('roi-yearly').textContent = Math.round(yearlyRevenue).toLocaleString();
    document.getElementById('roi-bookings').textContent = Math.round(bookingsPerMonth);
  }
  syncPair('roi-value','roi-value-range');
  syncPair('roi-missed','roi-missed-range');
  syncPair('roi-conv','roi-conv-range');
  calcROI();
</script>

<!-- Test Payment Button Handler (PROP.17 HOTFIX16) -->
<script>
(function() {
  const btn = document.getElementById('test-pay-btn');
  if (!btn) return;

  const TOKEN_EXAMPLE_ID = 'PAT-AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8';
  // Local preview: point to staging worker; production uses relative path
  const CHECKOUT_URL = location.hostname === 'localhost' || location.hostname === '127.0.0.1'
    ? 'https://nexora-payment-staging.nexorastudio-uk.workers.dev/api/payment/checkout-create'
    : '/api/payment/checkout-create';

  btn.addEventListener('click', async function() {
    btn.disabled = true;
    btn.textContent = 'Creating checkout…';

    try {
      const res = await fetch(CHECKOUT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: TOKEN_EXAMPLE_ID })
      });

      const data = await res.json();

      if (!res.ok || !data.ok) {
        throw new Error(data.error?.message || 'Checkout creation failed');
      }

      if (data.checkout_url) {
        window.location.href = data.checkout_url;
      } else {
        throw new Error('No checkout_url returned');
      }
    } catch (err) {
      btn.disabled = false;
      btn.textContent = 'Pay Invoice — TEST';
      alert('Test payment failed: ' + err.message);
    }
  });
})();
</script>
